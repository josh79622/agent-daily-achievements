<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A fictional interactive view of today's achievements."
    />
    <title>Daily Proof</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#constellation">Skip to achievements</a>

    <header class="page-header">
      <a class="brand" href="/" aria-label="Daily Proof home">Daily Proof</a>
      <time datetime="2026-09-16">16 Sep 2026</time>
      <button id="collector-toggle" type="button" aria-expanded="false">
        Local activity
      </button>
    </header>

    <main>
      <section
        id="constellation"
        class="constellation"
        aria-label="Today's fictional achievement constellation"
      ></section>
      <aside id="collector-panel" class="collector-panel" hidden>
        <div class="collector-panel-header">
          <p>Local activity</p>
          <button
            id="collector-close"
            type="button"
            aria-label="Close local activity"
          >
            ×
          </button>
        </div>
        <p id="collector-status">Reading local metadata…</p>
        <div id="collector-sources"></div>
        <div id="collector-sessions"></div>
      </aside>
    </main>
  </body>
</html>
